# ============================================================================
# Кеш nginx для sotamarket.com.ua (SotaMARKET на рушії) — ОГОЛОШЕННЯ.
#
# Куди класти:  /etc/nginx/conf.d/sotamarket-cache.conf
# Контекст:     http (conf.d підключається всередині http)
# Вживає:       шаблон Hestia sotamarket.stpl — proxy_cache sotamarket_cache і ключ з $sotamarket_lang.
#               Без шаблону файл нічого не робить, лише резервує пам'ять зони.
# Чистка:       deploy.sh після рестарту SOTAMARKET (find /var/cache/nginx-sotamarket -type f -delete)
#
# Окремо від floy_cache і smarket_cache свідомо: deploy.sh кожного сайту чистить свій кеш,
# не зачіпаючи інших. Термін і розмір — як у floy_cache (FLOY-ADMIN/NOTES/SERVER.md, «Кеші nginx»).
# ============================================================================

proxy_cache_path /var/cache/nginx-sotamarket levels=1:2 keys_zone=sotamarket_cache:20m max_size=1g inactive=24h use_temp_path=off;

# --- Мова з cookie — у ключ кешу замість Vary: Cookie ----------------------
# Рушій ставить на сторінки `Vary: Cookie`: адреса може віддати і 200, і 302 на обрану
# мову (middleware/locale-pref.global.ts, cookie floy_lang). На Vary nginx тримає окремий
# варіант на КОЖЕН рядок Cookie — відвідувач із `_ga` (GA4 у SotaMARKET є) завжди MISS
# (аудит FLOY 15.10). Значуща лише floy_lang, тож шаблон ігнорує Vary, а в ключ іде
# ця змінна: без вибору мови (і всі боти) — один спільний варіант, з вибором — по варіанту
# на мову, тож 302 на /uk ніколи не дістанеться тому, хто мови не обирав.
# Інші значення cookie — як порожнє: сміттям не роздути кеш.
map $cookie_floy_lang $sotamarket_lang_cookie {
    default "";
    uk      uk;
    ru      ru;
}

# Мова ділить на варіанти лише СТОРІНКИ. Картинки, чанки, API від cookie не залежать
# (Vary ставить тільки middleware сторінок): без цього винятку /img/… — найдорожчий шлях,
# генерація в Node — кешувались би на кожну мову окремо (28.10, FLOY-ADMIN/NOTES/plans/
# PLAN-FLOY-VHOST.md). Шляхи — server/routes, server/api і public/ рушія.
map $uri $sotamarket_lang {
    default                                   $sotamarket_lang_cookie;
    ~^/(img|_ipx|_nuxt|api|fonts|images)/     "";
}
