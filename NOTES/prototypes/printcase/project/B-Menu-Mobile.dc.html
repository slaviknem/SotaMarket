<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Print-Case — мобільне меню, варіант B «Наліпки»</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&amp;family=Montserrat:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#fffaf2}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; font-family: Montserrat, system-ui, sans-serif; color: #232129; background: #fffaf2; font-size: 15px; line-height: 1.4; display: flex; flex-direction: column; overflow: hidden">
<div style="padding: 10px 10px 0; flex-shrink: 0">
<div style="background: #ffffff; border-radius: 999px; height: 58px; padding: 0 6px 0 18px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 6px 20px rgba(35,33,41,.06)">
<span style="font-family: Comfortaa, Montserrat, sans-serif; font-weight: 700; font-size: 21px">print<span style="color: #f7941d">●</span>case</span>
<a href="B-Home-Mobile.dc.html" aria-label="Закрити меню" style="width: 46px; height: 46px; border-radius: 50%; background: #fff1de; display: grid; place-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
</div>
</div>
<div style="flex: 1; overflow: hidden; padding: 20px 14px 0; display: flex; flex-direction: column; gap: 18px">
<a href="#" style="height: 56px; border-radius: 999px; background: #ffffff; display: flex; align-items: center; gap: 12px; padding: 0 18px; font-weight: 700; box-shadow: 0 4px 14px rgba(35,33,41,.05)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.5"></rect></svg><span style="flex: 1">Твій телефон: iPhone 16e</span><span style="color: #9a4f00; font-size: 13.5px">змінити</span></a>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-family: Comfortaa, Montserrat, sans-serif; font-weight: 700; font-size: 20px; padding-left: 4px">Теми</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{ themes }}" as="t" hint-placeholder-count="8"><a href="#" style="height: 52px; border-radius: 999px; background: {{ t.bg }}; display: flex; align-items: center; padding: 0 18px; font-weight: 700">{{ t.t }}</a></sc-for>
</div>
</div>
<nav aria-label="Розділи" style="display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{ main }}" as="m" hint-placeholder-count="4"><a href="#" style="min-height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; font-family: Comfortaa, Montserrat, sans-serif; font-weight: 700; font-size: 19px">{{ m }}<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></a></sc-for>
</nav>
</div>
<div style="flex-shrink: 0; padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 8px">
<a href="#" style="height: 56px; border-radius: 999px; background: #f7941d; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px">Зробити свою наліпку</a>
<span style="display: flex; justify-content: center; gap: 6px"><a href="#" aria-current="true" style="min-width: 48px; height: 40px; border-radius: 999px; background: #232129; color: #ffffff; display: grid; place-items: center; font-weight: 700">UA</a><a href="#" style="min-width: 48px; height: 40px; border-radius: 999px; background: #ffffff; display: grid; place-items: center; font-weight: 600">RU</a></span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
themes: [
{ t: 'Квіти', bg: '#f9d9e6' }, { t: 'Тварини', bg: '#ffe7c7' }, { t: 'Аніме', bg: '#e5dcfb' }, { t: 'Кіно', bg: '#d6eefc' },
{ t: 'Дитячі', bg: '#fff1b8' }, { t: 'Ігри', bg: '#d9f2dc' }, { t: 'Авто', bg: '#e3e7ec' }, { t: 'Різне', bg: '#fde2d4' }
],
main: ['Усі дизайни', 'Бренди', 'Доставка й оплата', 'Про нас']
};
}
}
</script>
</body>
</html>
