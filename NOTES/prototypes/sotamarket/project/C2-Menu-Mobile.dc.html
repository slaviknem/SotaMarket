<!doctype html>

</helmet>
<div style="width: 390px; height: 844px; font-family: Nunito, system-ui, sans-serif; color: #13202d; background: #ffffff; font-size: 15px; line-height: 1.4; display: flex; flex-direction: column; overflow: hidden">

</div>
<div style="flex: 1; display: flex; min-height: 0">

<sc-for list="{{ brands }}" as="b" hint-placeholder-count="11"><a href="#" style="min-height: 48px; padding: 0 14px; display: flex; align-items: center; font-weight: 800; border-bottom: 1px solid rgba(255,255,255,.07)">{{ b }}</a></sc-for>
</nav>
<div style="flex: 1; min-width: 0; padding: 10px 14px; display: flex; flex-direction: column; overflow: hidden">

<span style="margin-top: 6px; font-size: 11.5px; font-weight: 900; letter-spacing: 1.3px; text-transform: uppercase; color: #9a4f00">iPhone</span>
<sc-for list="{{ iphones }}" as="m" hint-placeholder-count="13"><a href="#" style="min-height: 44px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #edf0f4; font-weight: 700">{{ m }}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#97a5b3" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></a></sc-for>
</div>
</div>
<div style="flex-shrink: 0; background: {{ c.i9 }}; color: {{ c.mu }}; padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px">

}
}
</script>
